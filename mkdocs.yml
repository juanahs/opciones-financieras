site_name: "Manual de Opciones Financieras"
site_description: "Guía estructurada para inversores: desde fundamentos hasta frameworks y modelos profesionales."
site_url: "https://juanahs.github.io/opciones-financieras/"
docs_dir: "chapters"
site_dir: "site"
exclude_docs: _archive/

theme:
  name: "material"
  language: es
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - toc.integrate
    - content.code.copy
    - navigation.tracking
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: "Switch to dark mode"

plugins:
  - awesome-pages
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
