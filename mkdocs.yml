site_name: "Manual de Opciones Financieras"
site_description: "Guía estructurada para inversores: desde fundamentos hasta frameworks y modelos profesionales."
docs_dir: "chapters"
site_dir: "site"

theme:
  name: "material"
  language: es
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.integrate
    - content.code.copy
    - navigation.tracking
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: "Switch to dark mode"

plugins:
  - awesome-pages
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences

