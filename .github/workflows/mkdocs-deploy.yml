name: Build and deploy MkDocs site

on:
  push:
    branches: [ main, master ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate mkdocs.yml nav
        run: |
          # Ensure Markdown files have a full front-matter template before generating nav
          python3 scripts/apply_frontmatter_template.py || true
          python3 scripts/generate_mkdocs_nav.py

      - name: Build MkDocs site
        run: mkdocs build --clean

      - name: Create root redirect index.html (no commit)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          SITE_URL="https://${OWNER}.github.io/${REPO}/"
          echo "Generating root index.html -> $SITE_URL"
          cat > index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0;url=${SITE_URL}" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <title>Ir al sitio — ${REPO}</title>
            </head>
            <body>
              <p>Si no eres redirigido automáticamente, <a href="${SITE_URL}">haz clic aquí para abrir el sitio</a>.</p>
            </body>
          </html>
          EOF

          echo "index.html generated but not committed by the workflow"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
