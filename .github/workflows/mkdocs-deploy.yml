name: Build and deploy MkDocs site

# Grant minimal permissions required for the job to publish via actions
permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [ main, master ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # Pin to a stable Python 3.x that is compatible with MkDocs plugins
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate mkdocs.yml nav
        run: |
          # Ensure Markdown files have a full front-matter template before generating nav
          python3 scripts/apply_frontmatter_template.py || true
          python3 scripts/generate_mkdocs_nav.py

      - name: Build MkDocs site
        run: mkdocs build --clean

      - name: Fix absolute asset paths for project pages
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # For project sites (OWNER.github.io/REPO/) MkDocs/Material emits
          # asset links starting with '/' which point to the domain root.
          # Insert a <base> tag in every generated HTML so absolute paths
          # resolve under the repository subpath. This avoids rewriting files
          # and works for JS/CSS/image assets.
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          BASE="/${REPO}/"
          echo "Inserting <base href='${BASE}'> into HTML files"
          # Insert the base tag right after the opening <head> in all HTML files
          find site -type f -name '*.html' -print0 | xargs -0 -n1 sed -i "0,/<head>/s|<head>|<head>\n  <base href='${BASE}'>|"

      - name: Create root redirect index.html (no commit)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          SITE_URL="https://${OWNER}.github.io/${REPO}/"
          echo "Generating root index.html -> $SITE_URL"
          cat > index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0;url=${SITE_URL}" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <title>Ir al sitio — ${REPO}</title>
            </head>
            <body>
              <p>Si no eres redirigido automáticamente, <a href="${SITE_URL}">haz clic aquí para abrir el sitio</a>.</p>
            </body>
          </html>
          EOF

          echo "index.html generated but not committed by the workflow"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
